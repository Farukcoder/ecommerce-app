; Override PHP-FPM pool settings for production Docker
[www]

; Run as www-data (same as Nginx)
user = www-data
group = www-data

; Listen on TCP (Nginx connects via 127.0.0.1:9000)
listen = 127.0.0.1:9000

; Process management
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Logging — send to stderr for Render.com log streaming
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
catch_workers_output = yes
decorate_workers_output = no

; Environment variable passthrough
clear_env = no
